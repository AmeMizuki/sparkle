    />
    <meta
      name="twitter:image"
      content="https://amemizuki.github.io/sparkle/sparkle-logo.png"
    />
    <script>
      // Apply the saved theme and palette before first paint so dark or tinted libraries do not flash.
      try {
        var surface = JSON.parse(
          localStorage.getItem("muse-surface") || "null",
        );
        if (surface) {
          var root = document.documentElement;
          root.classList.toggle("dark", surface.dark);
          for (var name in surface)
            if (name.indexOf("--") === 0)
              root.style.setProperty(name, surface[name]);
        }
      } catch (e) {}
    </script>
    <title>Sparkle | Your prompt library</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
