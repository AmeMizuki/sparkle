<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f5" />
    <meta
      name="description"
      content="Muse is your private, offline image and AI prompt library. Explore artists, save prompts, and organize your inspiration locally."
    />
    <script>
      // Apply the saved theme and palette before first paint so dark or tinted libraries do not flash.
      try {
        var surface = JSON.parse(
          localStorage.getItem("muse-surface") || "null",
        );
        if (surface) {
          var root = document.documentElement;
          root.classList.toggle("dark", surface.dark);
          for (var name in surface)
            if (name.indexOf("--") === 0)
              root.style.setProperty(name, surface[name]);
        }
      } catch (e) {}
    </script>
    <title>Sparkle | Your prompt library</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
